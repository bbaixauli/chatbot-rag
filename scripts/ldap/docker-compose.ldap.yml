# Añade un OpenLDAP de prueba al despliegue (solo para scripts/ldap-smoke.sh).
services:
  ldap:
    image: osixia/openldap:1.5.0
    hostname: ldap.ejemplo.org
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Ejemplo
      LDAP_DOMAIN: ejemplo.org
      LDAP_ADMIN_PASSWORD: admin-secreto
      LDAP_TLS_VERIFY_CLIENT: never
      # Certificados generados por scripts/ldap-smoke.sh (los de la imagen están caducados).
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
    volumes:
      - ./scripts/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro
      - ${LDAP_TEST_CERTS_DIR:?ejecuta scripts/ldap-smoke.sh}:/container/service/slapd/assets/certs:ro
    networks:
      default:
        aliases:
          - ldap.ejemplo.org
    healthcheck:
      test:
        - CMD
        - ldapsearch
        - -x
        - -H
        - ldap://localhost
        - -D
        - cn=admin,dc=ejemplo,dc=org
        - -w
        - admin-secreto
        - -b
        - ou=groups,dc=ejemplo,dc=org
        - cn=chatbot-admins
      interval: 3s
      retries: 20

  backend:
    depends_on:
      ldap:
        condition: service_healthy
