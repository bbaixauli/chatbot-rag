[project]
name = "chatbot-rag-backend"
version = "0.1.0"
description = "API del chatbot con RAG"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "cryptography>=50.0.2",
    "fastapi>=0.163.2",
    "itsdangerous>=2.2.0",
    "ldap3>=2.9.1",
    "markdown-it-py>=4.3.0",
    "numpy>=2.0",
    "odfpy>=1.4.1",
    "openai>=3.53.0",
    "openpyxl>=3.1",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "sqlalchemy[asyncio]>=2.1.9",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=6.3.0",
]
escalado = [
    "arq>=0.26",
    "qdrant-client>=1.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF", "S", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "ldap3.*", "openpyxl.*", "odf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "sqlite_only: depende de SQLite; se omite con CHATBOT_TEST_DATABASE_URL",
    "postgres_only: necesita PostgreSQL (CHATBOT_TEST_DATABASE_URL); si no, se omite",
]
addopts = "--cov=app --cov-report=term-missing"
# Avisos internos de ldap3 con versiones recientes de pyasn1.
filterwarnings = [
    "ignore:(tagMap|typeMap) is deprecated:DeprecationWarning",
    # Qdrant en memoria (tests) ignora los índices de payload; el servidor sí los usa.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85

[dependency-groups]
dev = [
    "arq>=0.26",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "qdrant-client>=1.15",
    "ruff>=0.17.5",
]
