# Despliegue con Docker: ver docs/despliegue.md
name: chatbot-rag

services:
  backend:
    build:
      context: ./backend
      args:
        UV_EXTRAS: ${CHATBOT_UV_EXTRAS:-}
    image: chatbot-rag-backend:${CHATBOT_IMAGE_TAG:-latest}
    env_file:
      - path: ${CHATBOT_ENV_FILE:-.env}
        required: true
    environment:
      CHATBOT_DATA_DIR: /data
    volumes:
      - chatbot-data:/data
    # Permite usar host.docker.internal para un servidor de IA en el mismo equipo (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # No se publica ningún puerto: solo nginx accede al backend.

  frontend:
    build: ./frontend
    image: chatbot-rag-frontend:${CHATBOT_IMAGE_TAG:-latest}
    environment:
      CHATBOT_MAX_BODY_SIZE: ${CHATBOT_MAX_BODY_SIZE:-60m}
      # IP o rangos del proxy HTTPS propio, si lo hay (ver docs/despliegue.md, «HTTPS»).
      CHATBOT_TRUSTED_PROXIES: ${CHATBOT_TRUSTED_PROXIES:-}
    ports:
      - "${CHATBOT_HTTP_BIND:-0.0.0.0}:${CHATBOT_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chatbot-data:
